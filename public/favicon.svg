<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0284c7" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Shield Shape -->
  <path d="M32 4 L54 11 C54 34 44 49 32 60 C20 49 10 34 10 11 Z" 
        fill="url(#shieldGrad)" 
        stroke="#ffffff" 
        stroke-width="2.5" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Inner High-Ground Mountain & Radar Chevron -->
  <path d="M20 42 L32 26 L44 42" 
        fill="none" 
        stroke="url(#accentGrad)" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- High Ground Peak Marker -->
  <circle cx="32" cy="26" r="3" fill="#ffffff"/>

  <!-- Satellite / Orbital Telemetry Waves -->
  <path d="M24 19 A10 10 0 0 1 40 19" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="2.5" 
        stroke-linecap="round"/>

  <path d="M19 14 A16 16 0 0 1 45 14" 
        fill="none" 
        stroke="url(#accentGrad)" 
        stroke-width="2.2" 
        stroke-linecap="round"
        stroke-dasharray="1 3"/>

  <!-- Center Telemetry Beacon Dot -->
  <circle cx="32" cy="18" r="2.2" fill="#38bdf8"/>

  <!-- Flood Water Waves at Bottom of Shield -->
  <path d="M22 47 C26 45 30 49 34 47 C38 45 40 47 42 47" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="2" 
        stroke-linecap="round" 
        opacity="0.85"/>
</svg>